[project]
name = "data-report-agent"
version = "0.1.0"
description = "Local-first, warehouse-agnostic AI Data Engineering, Quantitative Analysis, and BI Reporting Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "openpyxl>=3.1.5",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.4",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "plotly>=5.24.0",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
]

[tool.uv]
package = false
